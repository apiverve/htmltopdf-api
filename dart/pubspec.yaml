name: apiverve_htmltopdf
description: "This HTML to PDF API renders raw HTML markup into downloadable PDF files. Send your escaped HTML string to receive a signed download link, an expiration timestamp, and the generated document filename."
version: 1.2.5
homepage: https://apiverve.com/marketplace/htmltopdf?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/htmltopdf-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
